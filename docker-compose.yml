# Local stack. Start with `make up`; see docs/planning/trd.md §11.
# Data stores and the one-shot migrate service; the Go services, nginx, and profiles arrive in task-25.
name: quiz

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    # One-shot: run by `make up` (or `make migrate`) after the data stores are healthy.
    # Kept out of plain `docker compose up`, whose --wait treats an exited container as a failure.
    profiles: ["tools"]
    build:
      context: ./server
      args:
        CMD: migrate
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_DSN: ${POSTGRES_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  redis-data:
  postgres-data:

# Local stack. Start with `make up`; see docs/planning/trd.md §11.
# Default: nginx, api, 2× ws, 2× worker, redis, postgres, migrate. Profiles: observability, replica, chaos.
name: quiz

x-go-service: &go-service
  build:
    context: ./server
  env_file: .env
  restart: unless-stopped
  # Longer than SHUTDOWN_TIMEOUT (30 s), so a draining gateway isn't killed mid-drain.
  stop_grace_period: 35s
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 2s
    timeout: 3s
    retries: 15
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    toxiproxy:
      condition: service_started
      required: false

# Set by the Makefile per profile: chaos routes through Toxiproxy, replica turns on WAIT.
x-go-env: &go-env
  HTTP_ADDR: ":8080"
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  POSTGRES_DSN: ${POSTGRES_DSN}
  REDIS_WAIT_REPLICAS: ${REDIS_WAIT_REPLICAS:-0}

services:
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy

  api:
    <<: *go-service
    build: { context: ./server, args: { CMD: api } }
    environment: *go-env

  ws:
    <<: *go-service
    build: { context: ./server, args: { CMD: ws } }
    environment: *go-env
    deploy:
      replicas: 2
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  worker:
    <<: *go-service
    build: { context: ./server, args: { CMD: worker } }
    environment: *go-env
    deploy:
      replicas: 2

  migrate:
    build: { context: ./server, args: { CMD: migrate } }
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-quiz}:${POSTGRES_PASSWORD:-quiz-local-only}@postgres:5432/${POSTGRES_DB:-quiz}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ---- profile: replica (make up PROFILES=replica) ------------------------
  redis-replica:
    profiles: ["replica"]
    image: redis:7.4-alpine
    command: ["redis-server", "--replicaof", "redis", "6379"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q master_link_status:up"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ---- profile: chaos (make up PROFILES=chaos) ----------------------------
  toxiproxy:
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./deploy/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---- profile: observability (make up PROFILES=observability) ------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  redis-data:
  postgres-data:

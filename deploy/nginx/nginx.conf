# Edge proxy for the local stack (TRD §11.2): serves the client, routes /api and /ws.
worker_processes auto;
# crit only: error-level lines quote the request, token included (D15); failures still show in the access log's status.
error_log /dev/stderr crit;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Docker's DNS, re-read every 5 s so `make scale` adds and removes instances without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # $uri has no query string, so WebSocket tokens never reach the log (D15).
    log_format quiz '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time upstream=$upstream_addr';
    access_log /dev/stdout quiz;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        zone api 64k;
        server api:8080 resolve;
    }

    # Sockets are long-lived, so place each new one on the gateway with the fewest.
    upstream ws {
        zone ws 64k;
        least_conn;
        server ws:8080 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /nginx-health {
            access_log off;
            return 200;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /ws {
            proxy_pass http://ws;
            # A draining gateway answers 503; try the next one (a handshake is safe to retry).
            proxy_next_upstream error timeout http_503;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            # Longer than the 25 s ping interval, so idle but healthy sockets stay open.
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri /index.html;
        }
    }
}

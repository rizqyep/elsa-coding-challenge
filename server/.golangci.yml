version: "2"

run:
  timeout: 5m
  build-tags: [integration]   # lint integration tests too

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  exclusions:
    rules:
      # Tests read fixtures and contract files from paths they build themselves.
      - path: _test\.go
        linters: [gosec]
      # The healthcheck probes this process's own HTTP_ADDR; no request data reaches the URL.
      - path: internal/platform/health/probe\.go
        linters: [gosec]
        text: G704
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports

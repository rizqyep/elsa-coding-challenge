version: "2"

run:
  timeout: 5m
  build-tags: [integration, e2e]   # lint integration and end-to-end tests too

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  exclusions:
    rules:
      # Tests read fixtures and contract files from paths they build themselves.
      - path: _test\.go
        linters: [gosec]
      # The simulator reads the scenario file its operator names on the command line.
      - path: cmd/sim/
        linters: [gosec]
        text: G304
      # The test kit drives Docker with arguments it builds itself, and seeds math/rand so scenarios repeat.
      - path: testkit/
        linters: [gosec]
        text: "G204|G404"
      # The healthcheck probes this process's own HTTP_ADDR; no request data reaches the URL.
      - path: internal/platform/health/probe\.go
        linters: [gosec]
        text: G704
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
